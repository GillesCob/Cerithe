info:
  name: Transmission
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/transmissions/d6a5d3a9-dba1-431f-aa77-e2664abd4966
  headers:
    - name: authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "recipientEmail": "test@test.com"
      }
  auth: inherit
  vars:
    res:
      - name: transmissionToken
        value: res.body.split('/').pop()
        enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
